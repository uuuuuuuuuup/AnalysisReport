<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>点金 · 投资 AI 助手</title>
  <link rel="stylesheet" href="/ai.css">
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/dompurify.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- 侧栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="session-search" placeholder="搜索会话" autocomplete="off">
      </div>
      <button class="new-chat-btn" id="new-chat">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新对话
      </button>
      <nav class="session-list" id="session-list">
        <div class="session-group" data-group="today"><div class="group-label">今天</div><div class="group-items"></div></div>
        <div class="session-group" data-group="week"><div class="group-label">近 7 天</div><div class="group-items"></div></div>
        <div class="session-group" data-group="older"><div class="group-label">更早</div><div class="group-items"></div></div>
      </nav>
      <div class="sidebar-footer">
        <span class="user-avatar">m</span>
        <span class="user-name" id="user-name">mx_520687019</span>
        <button class="icon-btn" id="settings-btn" title="设置（下期）">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- 主区 -->
    <main class="main">
      <header class="chat-header">
        <button class="icon-btn" id="sidebar-toggle" title="折叠侧栏">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <div class="chat-title" id="chat-title" title="点击重命名">新对话</div>
        <div class="header-actions">
          <button class="icon-btn" id="export-btn" title="导出 Markdown">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <div class="input-area">
        <div class="chips-row" id="chips-row">
          <button class="chip" data-q="今日盈亏">今日盈亏</button>
          <button class="chip" data-q="持仓诊断">持仓诊断</button>
          <button class="chip" data-q="自选异动">自选异动</button>
          <button class="chip" data-q="资金流水">资金流水</button>
          <button class="tool-toggle on" id="tool-toggle" title="关闭后不调用数据工具">
            <span class="toggle-dot"></span>数据工具
          </button>
        </div>
        <div class="input-box">
          <textarea id="input" rows="1" placeholder="给点金发送消息…"></textarea>
          <button id="send-btn" title="发送">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0B1120" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="disclaimer">数据由同花顺 · 腾讯 · 新浪实时提供&nbsp;&nbsp;|&nbsp;&nbsp;AI 生成内容仅供参考，不构成投资建议</div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="banner hidden" id="banner"></div>

  <script src="/ai.js"></script>
</body>
</html>
